
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 600px;
      padding: 40px 24px;
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; }
    p { color: #cbd5e1; line-height: 1.7; }
    a {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>Ye meri pehli website hai, jo maine GitHub se banayi hai.</p>
    <a href="https://github.com/">Explore GitHub</a>
  </div>
</body>
</html>
